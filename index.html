<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>+ホップケア — 介護記録</title>

  <script src="https://cdn.jsdelivr.net/npm/@unocss/runtime@0.59.4/uno.global.js"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --cream: #FAF6EF; --cream-2: #F2EBDD; --sage: #7A8B6A; --sage-dark: #4F5D43;
      --sage-light: #B8C4A8; --coral: #C84B31; --amber: #C99A3B; --charcoal: #2E2A24;
      --charcoal-soft: #5C5448; --line: #E5DECF;
    }
    * { box-sizing: border-box; }
    body { background: var(--cream); font-family: 'Noto Sans JP', sans-serif; margin: 0; color: var(--charcoal); }
    .font-display { font-family: 'Zen Kaku Gothic New', sans-serif; font-weight: 700; }
    input, select, textarea { font-family: inherit; font-size: 15px; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; }
    .field { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
    .field:focus { outline: 2px solid var(--sage-light); }
    .btn { border: none; border-radius: 10px; padding: 10px 16px; font-weight: 700; cursor: pointer; }
    .btn-primary { background: var(--sage-dark); color: #fff; }
    .btn-ghost { background: var(--cream-2); color: var(--charcoal); }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; }
    table.audit { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.audit th, table.audit td { border: 1px solid #999; padding: 6px 8px; text-align: left; vertical-align: top; }
    table.audit th { background: #eee; }
    @media print {
      .no-print { display: none !important; }
      body { background: #fff; }
      .print-area { box-shadow: none !important; border: none !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect } = React;

    /* =========================================================
       設定：ここにSupabaseの情報を貼り付けてください（★3か所）
       ========================================================= */
    const SUPABASE_URL      = "https://mdpozsrzrrdmigeayzrl.supabase.co";   // ←★ Project URL（例 https://xxxx.supabase.co）
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1kcG96c3J6cnJkbWlnZWF5enJsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk5NTc5NTksImV4cCI6MjA5NTUzMzk1OX0.HxGlxpHDmq8e8RNcFqymm-QHfRQ8jVDZ6SlzsjYZqU0";   // ←★ anon（または publishable）キー
    const FACILITY_NAME     = "ホップケア";  // サービス表示名

    const isConfigured = SUPABASE_URL.startsWith("http") && SUPABASE_ANON_KEY.length > 20;
    const sb = isConfigured ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    /* ===================== 共通データ ===================== */
    const RECORD_TYPES = [
      { id: 'vital',      label: 'バイタル',     color: '#C84B31' },
      { id: 'meal',       label: '食事・水分',   color: '#D97706' },
      { id: 'nutrition',  label: '栄養・体重',   color: '#16A34A' },
      { id: 'excretion',  label: '排泄',         color: '#0891B2' },
      { id: 'sleep',      label: '睡眠',         color: '#7C3AED' },
      { id: 'medication', label: '服薬',         color: '#059669' },
      { id: 'bath',       label: '入浴・清拭',   color: '#2563EB' },
      { id: 'incident',   label: 'ヒヤリハット', color: '#DC2626' },
      { id: 'daily',      label: '本日のご様子', color: '#E89B45' },
      { id: 'free',       label: '自由記録',     color: '#6B7280' },
    ];
    const typeOf = (id) => RECORD_TYPES.find(t => t.id === id) || RECORD_TYPES[RECORD_TYPES.length - 1];
    const CARE_LEVELS = ['自立','要支援1','要支援2','要介護1','要介護2','要介護3','要介護4','要介護5'];
    const GENDERS = ['男性','女性','その他'];

    /* ===================== ユーティリティ ===================== */
    const pad = (n) => String(n).padStart(2, '0');
    const fmtDate = (iso) => { const d = new Date(iso); return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())}`; };
    const fmtTime = (iso) => { const d = new Date(iso); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
    const todayISODate = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
    const nowHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
    const ageFrom = (birth) => {
      if (!birth) return '';
      const b = new Date(birth), n = new Date();
      let a = n.getFullYear() - b.getFullYear();
      if (n.getMonth() < b.getMonth() || (n.getMonth() === b.getMonth() && n.getDate() < b.getDate())) a--;
      return a;
    };
    const lsGet = (k, d) => { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } };
    const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

    function structureRecordLocal(rawText, recordType) {
      const text = (rawText || '').trim();
      const fields = []; const tags = [];
      const push = (label, value) => { if (value != null && String(value).length) fields.push({ label, value: String(value) }); };
      const bp = text.match(/(?:血圧|BP)?\s*(\d{2,3})\s*[\/／]\s*(\d{2,3})/);
      if (bp) { const s=+bp[1], d=+bp[2]; push('血圧', `${s}/${d} mmHg`); if (s>=140||d>=90) tags.push('血圧高め'); else if (s<100) tags.push('血圧低め'); }
      const pulse = text.match(/(?:脈拍|脈|HR)\s*[:：]?\s*(\d{2,3})/);
      if (pulse) push('脈拍', `${pulse[1]} 回/分`);
      const temp = text.match(/(?:体温|BT|KT)?\s*((?:3[5-9]|4[0-2])[.．]\d)\s*(?:度|℃|°C)?/);
      if (temp) { const t=parseFloat(temp[1].replace('．','.')); push('体温', `${t}℃`); if (t>=37.5) tags.push('発熱'); }
      const spo2 = text.match(/(?:spo2|sao2|サチュ\S*)\s*[:：]?\s*(\d{2,3})\s*%?/i);
      if (spo2) { const v=+spo2[1]; push('SpO2', `${v}%`); if (v<95) tags.push('SpO2低下'); }
      const bs = text.match(/血糖\D{0,4}(\d{2,3})/);
      if (bs) push('血糖値', `${bs[1]} mg/dL`);
      const w = text.match(/(?:体重)\D{0,3}(\d{2,3}(?:[.．]\d)?)\s*kg/i) || text.match(/(\d{2,3}(?:[.．]\d)?)\s*kg/i);
      if (w) push('体重', `${w[1].replace('．','.')} kg`);
      const staple = text.match(/主食\s*(全量|完食|\d{1,2})\s*割?/);
      if (staple) push('主食', /全量|完食/.test(staple[1]) ? '10割' : `${staple[1]}割`);
      const side = text.match(/副食\s*(全量|完食|\d{1,2})\s*割?/);
      if (side) push('副食', /全量|完食/.test(side[1]) ? '10割' : `${side[1]}割`);
      const water = text.match(/水分\D{0,3}(\d{2,4})\s*(?:ml|cc|ｍｌ)/i);
      if (water) push('水分摂取', `${water[1]} ml`);
      if (/むせ/.test(text)) { if (/むせ(?:込み)?(?:なし|無し|無)/.test(text)) push('むせ','なし'); else { push('むせ','あり'); tags.push('むせ込みあり'); } }
      const urine = text.match(/排尿\D{0,3}(\d)\s*回?/); if (urine) push('排尿', `${urine[1]} 回`);
      const stool = text.match(/排便\D{0,3}(\d)\s*回?/); if (stool) push('排便', `${stool[1]} 回`);
      const sleep = text.match(/(?:睡眠時間|睡眠)\D{0,3}(\d(?:[.．]\d)?)\s*時間/); if (sleep) push('睡眠時間', `${sleep[1].replace('．','.')} 時間`);
      tags.unshift(typeOf(recordType).label);
      if (recordType === 'incident' || /転倒|転落|誤嚥|ヒヤリ|ぶつけ/.test(text)) tags.push('要観察');
      let note = '';
      const nm = text.match(/(?:申し送り|要観察|要注意|報告|様子見|看護師|医師|Dr|ナース)[^。\n]*[。\n]?/);
      if (nm) note = nm[0].replace(/\s+/g,' ').trim();
      return { fields, tags: [...new Set(tags)].slice(0,5), note };
    }

    function buildCSV(resident, records) {
      const head = ['施設','入居者氏名','日付','時刻','記録区分','内容','バイタル・項目','特記事項','記録者'];
      const esc = (s) => '"' + String(s ?? '').replace(/"/g,'""') + '"';
      const rows = records.map(r => {
        const f = (r.fields || []).map(x => `${x.label}:${x.value}`).join(' / ');
        return [resident._facility || '', resident.name, fmtDate(r.recorded_at), fmtTime(r.recorded_at), typeOf(r.record_type).label, r.content || '', f, r.note || '', r.recorder || ''].map(esc).join(',');
      });
      return '\uFEFF' + [head.map(esc).join(','), ...rows].join('\r\n');
    }
    function downloadText(filename, text, mime) {
      const blob = new Blob([text], { type: (mime || 'text/plain') + ';charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    /* ===================== アイコン ===================== */
    const Ic = ({ d, size=18 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{d}</svg>
    );
    const IconPlus  = (p) => <Ic {...p} d={<><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>} />;
    const IconBack  = (p) => <Ic {...p} d={<><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></>} />;
    const IconDoc   = (p) => <Ic {...p} d={<><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></>} />;
    const IconUsers = (p) => <Ic {...p} d={<><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></>} />;
    const IconHeart = (p) => <Ic {...p} d={<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/>} />;

    /* ===================== 設定未入力 ===================== */
    function SetupNotice() {
      return (
        <div className="max-w-2xl mx-auto p-6"><div className="card p-6">
          <h1 className="font-display text-xl mb-3">セットアップが必要です</h1>
          <p className="text-sm leading-relaxed" style={{ color:'var(--charcoal-soft)' }}>index.html 冒頭の <b>SUPABASE_URL</b> と <b>SUPABASE_ANON_KEY</b> に、Supabaseの値を貼り付けて再読み込みしてください（Project Settings → API）。</p>
        </div></div>
      );
    }

    /* ===================== ログイン ===================== */
    function Login() {
      const [email, setEmail] = useState(''); const [password, setPassword] = useState('');
      const [err, setErr] = useState(null); const [loading, setLoading] = useState(false);
      const submit = async () => {
        setErr(null); setLoading(true);
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) setErr('ログインに失敗しました。メールアドレスとパスワードをご確認ください。');
        setLoading(false);
      };
      return (
        <div className="min-h-screen flex items-center justify-center p-6"><div className="card p-7 w-full max-w-sm">
          <div className="font-display text-2xl mb-1">+ホップケア</div>
          <div className="text-sm mb-6" style={{ color:'var(--charcoal-soft)' }}>{FACILITY_NAME} 介護記録</div>
          <label className="text-xs font-bold">メールアドレス</label>
          <input className="field mt-1 mb-3" type="email" value={email} onChange={e=>setEmail(e.target.value)} />
          <label className="text-xs font-bold">パスワード</label>
          <input className="field mt-1 mb-4" type="password" value={password} onChange={e=>setPassword(e.target.value)} onKeyDown={e=>{ if(e.key==='Enter') submit(); }} />
          {err && <div className="text-sm mb-3" style={{ color:'var(--coral)' }}>{err}</div>}
          <button className="btn btn-primary w-full" disabled={loading} onClick={submit}>{loading ? '確認中…' : 'ログイン'}</button>
        </div></div>
      );
    }

    /* ===================== 入居者フォーム ===================== */
    function ResidentForm({ facilityId, onClose, onSaved }) {
      const [f, setF] = useState({ name:'', kana:'', birthdate:'', gender:'男性', care_level:'要介護1', room:'', admission_date: todayISODate(), notes:'' });
      const [saving, setSaving] = useState(false); const [err, setErr] = useState(null);
      const set = (k, v) => setF(p => ({ ...p, [k]: v }));
      const save = async () => {
        if (!f.name.trim()) { setErr('氏名は必須です'); return; }
        setSaving(true); setErr(null);
        const { error } = await sb.from('residents').insert([{ ...f, facility_id: facilityId, birthdate: f.birthdate || null, admission_date: f.admission_date || null }]);
        setSaving(false);
        if (error) { setErr('保存に失敗しました: ' + error.message); return; }
        onSaved();
      };
      return (
        <div className="card p-5 mb-5">
          <div className="font-display text-lg mb-4">新規入居者の登録</div>
          <div className="grid md:grid-cols-2 gap-3">
            <div><label className="text-xs font-bold">氏名 *</label><input className="field mt-1" value={f.name} onChange={e=>set('name', e.target.value)} /></div>
            <div><label className="text-xs font-bold">ふりがな</label><input className="field mt-1" value={f.kana} onChange={e=>set('kana', e.target.value)} /></div>
            <div><label className="text-xs font-bold">生年月日</label><input type="date" className="field mt-1" value={f.birthdate} onChange={e=>set('birthdate', e.target.value)} /></div>
            <div><label className="text-xs font-bold">性別</label><select className="field mt-1" value={f.gender} onChange={e=>set('gender', e.target.value)}>{GENDERS.map(g=><option key={g}>{g}</option>)}</select></div>
            <div><label className="text-xs font-bold">要介護度</label><select className="field mt-1" value={f.care_level} onChange={e=>set('care_level', e.target.value)}>{CARE_LEVELS.map(c=><option key={c}>{c}</option>)}</select></div>
            <div><label className="text-xs font-bold">居室番号</label><input className="field mt-1" value={f.room} onChange={e=>set('room', e.target.value)} /></div>
            <div><label className="text-xs font-bold">入居日</label><input type="date" className="field mt-1" value={f.admission_date} onChange={e=>set('admission_date', e.target.value)} /></div>
          </div>
          <div className="mt-3"><label className="text-xs font-bold">留意事項・特記</label><textarea className="field mt-1" rows="2" value={f.notes} onChange={e=>set('notes', e.target.value)} /></div>
          {err && <div className="text-sm mt-3" style={{ color:'var(--coral)' }}>{err}</div>}
          <div className="flex gap-2 mt-4">
            <button className="btn btn-primary" disabled={saving} onClick={save}>{saving ? '保存中…' : '登録する'}</button>
            <button className="btn btn-ghost" onClick={onClose}>キャンセル</button>
          </div>
        </div>
      );
    }

    /* ===================== 入居者一覧 ===================== */
    function ResidentList({ facilityId, onOpen }) {
      const [residents, setResidents] = useState(null);
      const [adding, setAdding] = useState(false); const [err, setErr] = useState(null);
      const load = async () => {
        const { data, error } = await sb.from('residents').select('*').eq('facility_id', facilityId).order('kana', { ascending: true });
        if (error) { setErr(error.message); setResidents([]); return; }
        setResidents(data || []);
      };
      useEffect(() => { setResidents(null); load(); }, [facilityId]);
      return (
        <div className="max-w-5xl mx-auto p-5">
          <div className="flex items-center justify-between mb-4">
            <h1 className="font-display text-2xl">入居者一覧</h1>
            <button className="btn btn-primary flex items-center gap-1" onClick={() => setAdding(true)}><IconPlus size={16}/>新規入居者</button>
          </div>
          {adding && <ResidentForm facilityId={facilityId} onClose={() => setAdding(false)} onSaved={() => { setAdding(false); load(); }} />}
          {err && <div className="text-sm mb-3" style={{ color:'var(--coral)' }}>読み込みエラー: {err}</div>}
          {residents === null ? <div className="text-sm" style={{color:'var(--charcoal-soft)'}}>読み込み中…</div>
            : residents.length === 0 ? <div className="card p-8 text-center text-sm" style={{color:'var(--charcoal-soft)'}}>まだ入居者が登録されていません。「新規入居者」から登録してください。</div>
            : (
            <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
              {residents.map(r => (
                <button key={r.id} className="card p-4 text-left hover:shadow-md transition" onClick={() => onOpen(r.id)}>
                  <div className="flex items-center justify-between mb-1">
                    <div className="font-display text-lg">{r.name}</div>
                    {r.room && <span className="badge" style={{ background:'var(--cream-2)' }}>{r.room}</span>}
                  </div>
                  <div className="text-xs" style={{ color:'var(--charcoal-soft)' }}>{r.kana}</div>
                  <div className="text-sm mt-2">{ageFrom(r.birthdate) !== '' ? `${ageFrom(r.birthdate)}歳・` : ''}{r.gender} ／ {r.care_level}</div>
                </button>
              ))}
            </div>
          )}
        </div>
      );
    }

    /* ===================== 記録フォーム ===================== */
    function RecordForm({ residentId, facilityId, onClose, onSaved }) {
      const [date, setDate] = useState(todayISODate());
      const [time, setTime] = useState(nowHM());
      const [type, setType] = useState('vital');
      const [content, setContent] = useState('');
      const [recorder, setRecorder] = useState(lsGet('hopcare_recorder', ''));
      const [shareFamily, setShareFamily] = useState(false);
      const [structured, setStructured] = useState(null);
      const [saving, setSaving] = useState(false); const [err, setErr] = useState(null);

      const runStructure = () => { if (content.trim()) setStructured(structureRecordLocal(content, type)); };
      const save = async () => {
        if (!content.trim()) { setErr('内容を入力してください'); return; }
        if (!recorder.trim()) { setErr('記録者名を入力してください（監査で必要です）'); return; }
        setSaving(true); setErr(null);
        const recorded_at = new Date(`${date}T${time}:00`).toISOString();
        const payload = {
          resident_id: residentId, facility_id: facilityId, recorded_at, record_type: type, content: content.trim(),
          fields: structured ? structured.fields : [], tags: structured ? structured.tags : [typeOf(type).label],
          note: structured ? structured.note : '', recorder: recorder.trim(), share_with_family: shareFamily,
        };
        const { error } = await sb.from('care_records').insert([payload]);
        setSaving(false);
        if (error) { setErr('保存に失敗しました: ' + error.message); return; }
        lsSet('hopcare_recorder', recorder.trim());
        onSaved();
      };
      return (
        <div className="card p-5 mb-5">
          <div className="font-display text-lg mb-4">記録を追加</div>
          <div className="grid sm:grid-cols-3 gap-3 mb-3">
            <div><label className="text-xs font-bold">日付</label><input type="date" className="field mt-1" value={date} onChange={e=>setDate(e.target.value)} /></div>
            <div><label className="text-xs font-bold">時刻</label><input type="time" className="field mt-1" value={time} onChange={e=>setTime(e.target.value)} /></div>
            <div><label className="text-xs font-bold">記録区分</label><select className="field mt-1" value={type} onChange={e=>setType(e.target.value)}>{RECORD_TYPES.map(t=><option key={t.id} value={t.id}>{t.label}</option>)}</select></div>
          </div>
          <label className="text-xs font-bold">内容</label>
          <textarea className="field mt-1" rows="3" placeholder="例：7:30 血圧142/88 体温36.8 朝食 主食8割 むせなし" value={content} onChange={e=>setContent(e.target.value)} />
          <div className="flex items-center gap-2 mt-2">
            <button className="btn btn-ghost text-sm" onClick={runStructure}>自動整形（任意）</button>
            <span className="text-xs" style={{ color:'var(--charcoal-soft)' }}>数値や項目を自動抽出します（外部送信なし）</span>
          </div>
          {structured && (
            <div className="mt-3 p-3 rounded-lg" style={{ background:'var(--cream-2)' }}>
              {structured.fields.length > 0 && <div className="text-sm mb-1"><b>項目：</b>{structured.fields.map(f=>`${f.label} ${f.value}`).join('、')}</div>}
              {structured.tags.length > 0 && <div className="text-xs mb-1">{structured.tags.map(t=><span key={t} className="badge mr-1" style={{background:'#fff'}}>{t}</span>)}</div>}
              {structured.note && <div className="text-sm"><b>申し送り：</b>{structured.note}</div>}
            </div>
          )}
          <div className="grid sm:grid-cols-2 gap-3 mt-3 items-end">
            <div><label className="text-xs font-bold">記録者 *</label><input className="field mt-1" value={recorder} onChange={e=>setRecorder(e.target.value)} placeholder="記録した職員名" /></div>
            <label className="flex items-center gap-2 text-sm p-2 rounded-lg" style={{ background:'var(--cream-2)' }}>
              <input type="checkbox" checked={shareFamily} onChange={e=>setShareFamily(e.target.checked)} />
              この記録をご家族に共有する
            </label>
          </div>
          {err && <div className="text-sm mt-3" style={{ color:'var(--coral)' }}>{err}</div>}
          <div className="flex gap-2 mt-4">
            <button className="btn btn-primary" disabled={saving} onClick={save}>{saving ? '保存中…' : '記録を保存'}</button>
            <button className="btn btn-ghost" onClick={onClose}>キャンセル</button>
          </div>
        </div>
      );
    }

    /* ===================== 入居者ページ ===================== */
    function ResidentPage({ residentId, onBack, onFamily }) {
      const [resident, setResident] = useState(null);
      const [records, setRecords] = useState(null);
      const [adding, setAdding] = useState(false); const [err, setErr] = useState(null);
      const load = async () => {
        const { data: r } = await sb.from('residents').select('*').eq('id', residentId).single();
        setResident(r);
        const { data: recs, error } = await sb.from('care_records').select('*').eq('resident_id', residentId).order('recorded_at', { ascending: false });
        if (error) setErr(error.message);
        setRecords(recs || []);
      };
      useEffect(() => { load(); }, [residentId]);
      const removeRecord = async (id) => { if (!window.confirm('この記録を削除しますか？')) return; await sb.from('care_records').delete().eq('id', id); load(); };
      const toggleShare = async (rec) => { await sb.from('care_records').update({ share_with_family: !rec.share_with_family }).eq('id', rec.id); load(); };
      if (!resident) return <div className="max-w-4xl mx-auto p-5 text-sm" style={{color:'var(--charcoal-soft)'}}>読み込み中…</div>;
      return (
        <div className="max-w-4xl mx-auto p-5">
          <button className="btn btn-ghost flex items-center gap-1 mb-4 text-sm" onClick={onBack}><IconBack size={16}/>一覧へ戻る</button>
          <div className="card p-5 mb-5">
            <div className="flex items-center justify-between">
              <div>
                <div className="font-display text-2xl">{resident.name}</div>
                <div className="text-xs" style={{ color:'var(--charcoal-soft)' }}>{resident.kana}</div>
              </div>
              <div className="flex items-center gap-2">
                {resident.room && <span className="badge" style={{ background:'var(--cream-2)' }}>{resident.room}</span>}
                <button className="btn btn-ghost text-sm flex items-center gap-1" onClick={() => onFamily(residentId)}><IconHeart size={15}/>家族向け表示</button>
              </div>
            </div>
            <div className="grid sm:grid-cols-4 gap-3 mt-4 text-sm">
              <div><div className="text-xs" style={{color:'var(--charcoal-soft)'}}>年齢</div>{ageFrom(resident.birthdate) !== '' ? `${ageFrom(resident.birthdate)}歳` : '—'}</div>
              <div><div className="text-xs" style={{color:'var(--charcoal-soft)'}}>性別</div>{resident.gender || '—'}</div>
              <div><div className="text-xs" style={{color:'var(--charcoal-soft)'}}>要介護度</div>{resident.care_level || '—'}</div>
              <div><div className="text-xs" style={{color:'var(--charcoal-soft)'}}>入居日</div>{resident.admission_date ? fmtDate(resident.admission_date) : '—'}</div>
            </div>
            {resident.notes && <div className="mt-3 p-3 rounded-lg text-sm" style={{ background:'var(--cream-2)' }}><b>留意事項：</b>{resident.notes}</div>}
          </div>

          <div className="flex items-center justify-between mb-3">
            <h2 className="font-display text-xl">ケア記録</h2>
            <button className="btn btn-primary flex items-center gap-1" onClick={() => setAdding(true)}><IconPlus size={16}/>記録を追加</button>
          </div>
          {adding && <RecordForm residentId={residentId} facilityId={resident.facility_id} onClose={() => setAdding(false)} onSaved={() => { setAdding(false); load(); }} />}
          {err && <div className="text-sm mb-3" style={{ color:'var(--coral)' }}>{err}</div>}
          {records === null ? <div className="text-sm" style={{color:'var(--charcoal-soft)'}}>読み込み中…</div>
            : records.length === 0 ? <div className="card p-6 text-center text-sm" style={{color:'var(--charcoal-soft)'}}>まだ記録がありません。</div>
            : (
            <div className="flex flex-col gap-3">
              {records.map(r => { const t = typeOf(r.record_type); return (
                <div key={r.id} className="card p-4">
                  <div className="flex items-center justify-between mb-2">
                    <div className="flex items-center gap-2">
                      <span className="badge" style={{ background:t.color, color:'#fff' }}>{t.label}</span>
                      <span className="text-sm font-bold">{fmtDate(r.recorded_at)} {fmtTime(r.recorded_at)}</span>
                    </div>
                    <div className="flex items-center gap-3">
                      <button className="text-xs flex items-center gap-1" style={{ color: r.share_with_family ? 'var(--sage-dark)' : 'var(--charcoal-soft)' }} onClick={() => toggleShare(r)}>
                        <IconHeart size={13}/>{r.share_with_family ? '家族に共有中' : '家族に共有'}
                      </button>
                      <button className="text-xs" style={{ color:'var(--charcoal-soft)' }} onClick={() => removeRecord(r.id)}>削除</button>
                    </div>
                  </div>
                  <div className="text-sm whitespace-pre-wrap">{r.content}</div>
                  {r.fields && r.fields.length > 0 && <div className="text-sm mt-2" style={{color:'var(--charcoal-soft)'}}>{r.fields.map(f=>`${f.label} ${f.value}`).join('、')}</div>}
                  {r.note && <div className="text-sm mt-1"><b>申し送り：</b>{r.note}</div>}
                  <div className="text-xs mt-2" style={{ color:'var(--charcoal-soft)' }}>記録者：{r.recorder || '—'}</div>
                </div>
              ); })}
            </div>
          )}
        </div>
      );
    }

    /* ===================== 家族向け表示 ===================== */
    function FamilyView({ residentId, facilityName, onBack }) {
      const [resident, setResident] = useState(null);
      const [records, setRecords] = useState(null);
      useEffect(() => { (async () => {
        const { data: r } = await sb.from('residents').select('*').eq('id', residentId).single();
        setResident(r);
        const { data: recs } = await sb.from('care_records').select('*').eq('resident_id', residentId).eq('share_with_family', true).order('recorded_at', { ascending: false });
        setRecords(recs || []);
      })(); }, [residentId]);
      if (!resident) return <div className="max-w-3xl mx-auto p-5 text-sm" style={{color:'var(--charcoal-soft)'}}>読み込み中…</div>;
      return (
        <div className="max-w-3xl mx-auto p-5">
          <div className="flex items-center gap-2 mb-4 no-print">
            <button className="btn btn-ghost flex items-center gap-1 text-sm" onClick={onBack}><IconBack size={16}/>記録に戻る</button>
            <button className="btn btn-ghost text-sm" onClick={() => window.print()}>印刷 / PDF保存</button>
          </div>
          <div className="card p-7 print-area">
            <div className="text-center mb-5">
              <div className="flex items-center justify-center gap-2" style={{ color:'var(--sage-dark)' }}><IconHeart size={22}/></div>
              <div className="font-display text-2xl mt-1">{resident.name} 様の生活のようす</div>
              <div className="text-sm mt-1" style={{ color:'var(--charcoal-soft)' }}>{facilityName || ''}　{fmtDate(new Date().toISOString())} 時点</div>
            </div>
            <p className="text-sm leading-relaxed mb-5" style={{ color:'var(--charcoal-soft)' }}>
              いつも{resident.name}様を見守ってくださり、ありがとうございます。施設での最近のご様子をお届けします。
            </p>
            {records === null ? <div className="text-sm" style={{color:'var(--charcoal-soft)'}}>読み込み中…</div>
              : records.length === 0 ? <div className="text-center text-sm py-6" style={{color:'var(--charcoal-soft)'}}>現在、ご家族向けに共有されている記録はありません。</div>
              : (
              <div className="flex flex-col gap-3">
                {records.map(r => { const t = typeOf(r.record_type); return (
                  <div key={r.id} className="p-4 rounded-xl" style={{ background:'var(--cream)', border:'1px solid var(--line)' }}>
                    <div className="flex items-center gap-2 mb-1">
                      <span className="badge" style={{ background:t.color, color:'#fff' }}>{t.label}</span>
                      <span className="text-sm font-bold">{fmtDate(r.recorded_at)}</span>
                    </div>
                    <div className="text-sm whitespace-pre-wrap">{r.content}</div>
                    {r.fields && r.fields.length > 0 && <div className="text-sm mt-2" style={{color:'var(--charcoal-soft)'}}>{r.fields.map(f=>`${f.label} ${f.value}`).join('、')}</div>}
                  </div>
                ); })}
              </div>
            )}
            <div className="text-xs text-center mt-6" style={{ color:'var(--charcoal-soft)' }}>※ ご不明な点は施設職員までお気軽にお声がけください。</div>
          </div>
        </div>
      );
    }

    /* ===================== 監査用 出力 ===================== */
    function AuditExport({ facilityId, facilityName }) {
      const [residents, setResidents] = useState([]);
      const [rid, setRid] = useState('');
      const [from, setFrom] = useState(() => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-01`; });
      const [to, setTo] = useState(todayISODate());
      const [doc, setDoc] = useState(null); const [loading, setLoading] = useState(false);
      useEffect(() => { (async () => {
        const { data } = await sb.from('residents').select('id,name,kana').eq('facility_id', facilityId).order('kana');
        setResidents(data || []); setRid(data && data[0] ? data[0].id : '');
      })(); }, [facilityId]);
      const generate = async () => {
        if (!rid) return; setLoading(true);
        const { data: full } = await sb.from('residents').select('*').eq('id', rid).single();
        const fromISO = new Date(`${from}T00:00:00`).toISOString();
        const toISO = new Date(`${to}T23:59:59`).toISOString();
        const { data: recs } = await sb.from('care_records').select('*').eq('resident_id', rid).gte('recorded_at', fromISO).lte('recorded_at', toISO).order('recorded_at', { ascending: true });
        setDoc({ resident: { ...full, _facility: facilityName }, records: recs || [], from, to });
        setLoading(false);
      };
      const csv = () => { if (!doc) return; downloadText(`介護記録_${doc.resident.name}_${doc.from}_${doc.to}.csv`, buildCSV(doc.resident, doc.records), 'text/csv'); };
      return (
        <div className="max-w-4xl mx-auto p-5">
          <h1 className="font-display text-2xl mb-4 no-print">監査用 記録出力</h1>
          <div className="card p-5 mb-5 no-print">
            <div className="grid sm:grid-cols-4 gap-3">
              <div className="sm:col-span-2"><label className="text-xs font-bold">入居者</label>
                <select className="field mt-1" value={rid} onChange={e=>setRid(e.target.value)}>{residents.map(r=><option key={r.id} value={r.id}>{r.name}</option>)}</select></div>
              <div><label className="text-xs font-bold">期間（開始）</label><input type="date" className="field mt-1" value={from} onChange={e=>setFrom(e.target.value)} /></div>
              <div><label className="text-xs font-bold">期間（終了）</label><input type="date" className="field mt-1" value={to} onChange={e=>setTo(e.target.value)} /></div>
            </div>
            <div className="flex gap-2 mt-4">
              <button className="btn btn-primary" disabled={loading} onClick={generate}>{loading ? '作成中…' : '記録を表示'}</button>
              {doc && <button className="btn btn-ghost" onClick={() => window.print()}>印刷 / PDF保存</button>}
              {doc && <button className="btn btn-ghost" onClick={csv}>CSVダウンロード</button>}
            </div>
          </div>
          {doc && (
            <div className="card p-6 print-area">
              <div className="text-center mb-4">
                <div className="font-display text-xl">介護記録（ケア記録）</div>
                <div className="text-sm" style={{ color:'var(--charcoal-soft)' }}>{facilityName || FACILITY_NAME}</div>
              </div>
              <table className="audit mb-4"><tbody>
                <tr><th style={{width:'18%'}}>入居者氏名</th><td>{doc.resident.name}（{doc.resident.kana}）</td><th style={{width:'18%'}}>要介護度</th><td>{doc.resident.care_level || '—'}</td></tr>
                <tr><th>生年月日</th><td>{doc.resident.birthdate ? `${fmtDate(doc.resident.birthdate)}（${ageFrom(doc.resident.birthdate)}歳）` : '—'}</td><th>居室</th><td>{doc.resident.room || '—'}</td></tr>
                <tr><th>対象期間</th><td>{doc.from} 〜 {doc.to}</td><th>出力日</th><td>{fmtDate(new Date().toISOString())}</td></tr>
              </tbody></table>
              <table className="audit">
                <thead><tr><th style={{width:'12%'}}>日付</th><th style={{width:'7%'}}>時刻</th><th style={{width:'12%'}}>区分</th><th>内容・バイタル等</th><th style={{width:'14%'}}>記録者</th></tr></thead>
                <tbody>
                  {doc.records.length === 0 ? <tr><td colSpan="5" style={{textAlign:'center'}}>対象期間の記録はありません</td></tr>
                  : doc.records.map(r => (
                    <tr key={r.id}>
                      <td>{fmtDate(r.recorded_at)}</td><td>{fmtTime(r.recorded_at)}</td><td>{typeOf(r.record_type).label}</td>
                      <td>{r.content}
                        {r.fields && r.fields.length > 0 && <div style={{ color:'#555' }}>［{r.fields.map(f=>`${f.label} ${f.value}`).join('、')}］</div>}
                        {r.note && <div>※申し送り：{r.note}</div>}
                      </td>
                      <td>{r.recorder || '—'}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
              <div className="text-xs mt-3" style={{ color:'var(--charcoal-soft)' }}>総記録件数：{doc.records.length}件</div>
            </div>
          )}
        </div>
      );
    }

    /* ===================== アプリ本体 ===================== */
    function App() {
      const [session, setSession] = useState(undefined);
      const [facilities, setFacilities] = useState(null); // null=loading, []=未割り当て
      const [facilityId, setFacilityId] = useState(null);
      const [view, setView] = useState('list');   // list | resident | audit | family
      const [rid, setRid] = useState(null);

      useEffect(() => {
        sb.auth.getSession().then(({ data }) => setSession(data.session));
        const { data: sub } = sb.auth.onAuthStateChange((_e, s) => setSession(s));
        return () => sub.subscription.unsubscribe();
      }, []);

      useEffect(() => {
        if (!session) { setFacilities(null); return; }
        (async () => {
          const { data } = await sb.from('facility_members').select('facilities(id,code,name)');
          const list = (data || []).map(r => r.facilities).filter(Boolean).sort((a,b)=> (a.code||'').localeCompare(b.code||''));
          setFacilities(list);
          setFacilityId(list[0] ? list[0].id : null);
        })();
      }, [session]);

      if (session === undefined) return <div className="p-10 text-center text-sm" style={{color:'var(--charcoal-soft)'}}>読み込み中…</div>;
      if (!session) return <Login />;
      if (facilities === null) return <div className="p-10 text-center text-sm" style={{color:'var(--charcoal-soft)'}}>施設情報を読み込み中…</div>;
      if (facilities.length === 0) return (
        <div className="min-h-screen flex items-center justify-center p-6"><div className="card p-7 max-w-sm text-center">
          <div className="font-display text-lg mb-2">施設が割り当てられていません</div>
          <p className="text-sm mb-4" style={{color:'var(--charcoal-soft)'}}>このアカウントはまだ施設に紐付けられていません。管理者にお問い合わせください。</p>
          <button className="btn btn-ghost text-sm" onClick={() => sb.auth.signOut()}>ログアウト</button>
        </div></div>
      );

      const current = facilities.find(f => f.id === facilityId) || facilities[0];
      return (
        <div className="min-h-screen">
          <header className="no-print" style={{ background:'#fff', borderBottom:'1px solid var(--line)' }}>
            <div className="max-w-5xl mx-auto px-5 py-3 flex items-center justify-between flex-wrap gap-2">
              <div className="font-display text-lg flex items-center gap-2">+ホップケア
                {facilities.length > 1
                  ? <select className="field" style={{ width:'auto', padding:'4px 8px', fontSize:'13px' }} value={facilityId} onChange={e=>{ setFacilityId(e.target.value); setView('list'); }}>
                      {facilities.map(f => <option key={f.id} value={f.id}>{f.code}｜{f.name}</option>)}
                    </select>
                  : <span className="text-xs font-normal" style={{color:'var(--charcoal-soft)'}}>{current.code}｜{current.name}</span>}
              </div>
              <div className="flex items-center gap-1">
                <button className={"btn text-sm flex items-center gap-1 " + (view==='list'||view==='resident'||view==='family'?'btn-primary':'btn-ghost')} onClick={() => setView('list')}><IconUsers size={15}/>入居者</button>
                <button className={"btn text-sm flex items-center gap-1 " + (view==='audit'?'btn-primary':'btn-ghost')} onClick={() => setView('audit')}><IconDoc size={15}/>監査出力</button>
                <button className="btn btn-ghost text-sm" onClick={() => sb.auth.signOut()}>ログアウト</button>
              </div>
            </div>
          </header>
          <main className="py-4">
            {view === 'list' && <ResidentList facilityId={facilityId} onOpen={(id) => { setRid(id); setView('resident'); }} />}
            {view === 'resident' && rid && <ResidentPage residentId={rid} onBack={() => setView('list')} onFamily={(id) => { setRid(id); setView('family'); }} />}
            {view === 'family' && rid && <FamilyView residentId={rid} facilityName={current.name} onBack={() => setView('resident')} />}
            {view === 'audit' && <AuditExport facilityId={facilityId} facilityName={current.name} />}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(isConfigured ? <App /> : <SetupNotice />);
  </script>
</body>
</html>
